# W-1 transient scope properties (DEFENSIVE confinement config). SOURCE-ONLY, NOT EXECUTED.
#
# There is NO installed systemd slice or unit FILE in the no-images configuration. The
# per-attempt confinement scope is a TRANSIENT system-manager scope that RL creates at
# run time with `systemd-run --scope` inside the lead's existing user-1000.slice; it is a
# runtime object, not a setup artifact. The exact invocation is v11 Section 12.2 step 6.
#
# Launcher scope (verb `launch`), RL stage-1 exec (Section 12.2 step 6; Section 8.3):
#
#   /usr/bin/systemd-run --scope --quiet \
#     --slice=user-1000.slice \
#     --unit=wlscratch-<g12>-<A>.scope \
#     -p MemoryMax=8G \
#     -p MemorySwapMax=0 \
#     -p LogLevelMax=warning \
#     <plus the matched scope properties of Section 8.3, from prestate P27/P28> \
#     -- /usr/bin/python3 -I -B /opt/wlscratch/frame-v6w1/sandbox_launch.py <verb>-scoped <args>
#
# Observer scope (verb `observe`): unit wlscratch-o-<g12>-<A>-<n>.scope, SAME slice, but
# NO memory properties (v5 took observations in the unscoped frame process).
#
# Rationale (Section 12.3 V10'): a system-manager scope directly in user-1000.slice, not a
# user-manager scope in app.slice, so app.slice's shared limits and user@1000.service's do
# not apply, and `systemctl --user` does not list it. The cgroup is one no non-root process
# can enter or leave (premise P-CG). MemoryMax/MemorySwapMax and the matched Section 8.3
# properties are v5's or the original's values.
#
# IMPLEMENTATION STATUS: MISSING. RL (sandbox_launch.py) does not exist as frozen code;
# the existing frame v6 scratch.py uses `systemd-run --user --scope` in app.slice
# (scratch.py:1579), which is v5's user-scope, NOT this system-scope. See GAP.md P4/M13.
#
# IMAGES-ONLY unit files (option S-1 option 3, Section 14.5 S-J): if the images storage
# option is chosen, TWO mount-unit files ARE installed (work image on /var/lib/wlscratch/runs,
# records image on /var/lib/wlscratch/runs/records) as staged-rename atoms J5a/J7a, enabled
# and started (J5b/J7b), with two `systemctl daemon-reload` service actions. Those unit files
# are conditional (N/A unless images chosen) and are not reproduced here; their exact bytes
# belong to the concrete inventory's S-J.
